

services:

  # --------- CONTROLLER (builds its own image) ---------
  controller:
    build:
      context: .
      dockerfile: Dockerfile.controller
    image: ansible-controller:latest
    container_name: ansible-controller
    hostname: controller
    networks:
      - ansiblenet
    volumes:
      - ./ansible:/ansible
    tty: true

  # --------- NODE IMAGE BUILDER (build once, reuse everywhere) ---------
  node-image:
    build:
      context: .
      dockerfile: Dockerfile.node
    image: ansible-node:latest
    container_name: node-image
    hostname: node-image
    networks:
      - ansiblenet
    command: ["sleep", "infinity"]
    # This service exists only so the image gets built.
    # It just sleeps; you can ignore this container.

  # --------- NODES (all use the same built image) ---------
  node1:
    image: ansible-node:latest
    container_name: node1
    hostname: node1
    networks:
      - ansiblenet
    depends_on:
      - node-image

  node2:
    image: ansible-node:latest
    container_name: node2
    hostname: node2
    networks:
      - ansiblenet
    depends_on:
      - node-image

  node3:
    image: ansible-node:latest
    container_name: node3
    hostname: node3
    networks:
      - ansiblenet
    depends_on:
      - node-image

  node4:
    image: ansible-node:latest
    container_name: node4
    hostname: node4
    networks:
      - ansiblenet
    depends_on:
      - node-image

  node5:
    image: ansible-node:latest
    container_name: node5
    hostname: node5
    networks:
      - ansiblenet
    depends_on:
      - node-image

  node6:
    image: ansible-node:latest
    container_name: node6
    hostname: node6
    networks:
      - ansiblenet
    depends_on:
      - node-image

  node7:
    image: ansible-node:latest
    container_name: node7
    hostname: node7
    networks:
      - ansiblenet
    depends_on:
      - node-image

  node8:
    image: ansible-node:latest
    container_name: node8
    hostname: node8
    networks:
      - ansiblenet
    depends_on:
      - node-image

  node9:
    image: ansible-node:latest
    container_name: node9
    hostname: node9
    networks:
      - ansiblenet
    depends_on:
      - node-image

  node10:
    image: ansible-node:latest
    container_name: node10
    hostname: node10
    networks:
      - ansiblenet
    depends_on:
      - node-image

networks:
  ansiblenet:
    driver: bridge
